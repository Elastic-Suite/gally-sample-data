include:
    - shared_cms_source_field.yaml
    - localized_catalogs.yaml

# A SourceFieldLabel is unique on (localized_catalog, source_field), so every field needs a row
# per localized catalog of ours even though default/ owns the field.
# The label reference name is built from the code rather than the field reference, which is also
# what default/ does - hence `cms_page_title_*` against a field whose own reference is
# `cms_page_tile`.

Gally\Metadata\Entity\SourceFieldLabel:
    cms_page_id_toolbox_fr:
        source_field: '@cms_page_id'
        localized_catalog: '@toolbox_fr'
        label: 'Identifiant'
