include:
    - ../localized_catalogs.yaml

# Scoped by localized catalog rather than by locale. A locale scope would reach fr_FR everywhere,
# including the other sample catalogs, and a synonym written for hardware has no business in a
# clothes shop.
Gally\Thesaurus\Entity\Thesaurus:
    tbx_thesaurus1:
        name: 'Toolbox #1 - Synonym (fr)'
        isActive: true
        type: !php/const Gally\Thesaurus\Entity\Thesaurus::TYPE_SYNONYM
        scopeType: !php/const Gally\Thesaurus\Entity\Thesaurus::SCOPE_TYPE_LOCALIZED_CATALOG
        localizedCatalogs: ['@toolbox_fr']
    tbx_thesaurus3:
        name: 'Toolbox #3 - Synonym (en)'
        isActive: true
        type: !php/const Gally\Thesaurus\Entity\Thesaurus::TYPE_SYNONYM
        scopeType: !php/const Gally\Thesaurus\Entity\Thesaurus::SCOPE_TYPE_LOCALIZED_CATALOG
        localizedCatalogs: ['@toolbox_en']
    tbx_thesaurus4:
        name: 'Toolbox #4 - Synonym (de)'
        isActive: true
        type: !php/const Gally\Thesaurus\Entity\Thesaurus::TYPE_SYNONYM
        scopeType: !php/const Gally\Thesaurus\Entity\Thesaurus::SCOPE_TYPE_LOCALIZED_CATALOG
        localizedCatalogs: ['@toolbox_de']
    tbx_thesaurus2:
        name: 'Toolbox #2 - Expansion'
        isActive: true
        type: !php/const Gally\Thesaurus\Entity\Thesaurus::TYPE_EXPANSION
        scopeType: !php/const Gally\Thesaurus\Entity\Thesaurus::SCOPE_TYPE_LOCALIZED_CATALOG
        localizedCatalogs: ['@toolbox_fr']

Gally\Thesaurus\Entity\Thesaurus\Synonym:
    tbx_synonym1:
        thesaurus: '@tbx_thesaurus1'
    tbx_synonym2:
        thesaurus: '@tbx_thesaurus3'
    tbx_synonym3:
        thesaurus: '@tbx_thesaurus4'

# One thesaurus per shopfront, each joining two words of its own language: the word a visitor
# types and the word the products use. The angle grinder is "disqueuse" in everyday French and
# "Flex" in German; "spanner" is the British word for a wrench. A thesaurus never translates:
# each shopfront already has its own product texts.
Gally\Thesaurus\Entity\Thesaurus\Synonym\Term:
    tbx_synonym_term1:
        synonym: '@tbx_synonym1'
        term: 'disqueuse'
    tbx_synonym_term2:
        synonym: '@tbx_synonym1'
        term: 'meuleuse'
    tbx_synonym_term3:
        synonym: '@tbx_synonym2'
        term: 'spanner'
    tbx_synonym_term4:
        synonym: '@tbx_synonym2'
        term: 'wrench'
    tbx_synonym_term5:
        synonym: '@tbx_synonym3'
        term: 'flex'
    tbx_synonym_term6:
        synonym: '@tbx_synonym3'
        term: 'winkelschleifer'

Gally\Thesaurus\Entity\Thesaurus\Expansion:
    tbx_expansion1:
        thesaurus: '@tbx_thesaurus2'
        referenceTerm: 'visseuse'

# One way only: a search for "visseuse" also reaches drills and screwdrivers, but a search for
# "tournevis" stays on screwdrivers.
Gally\Thesaurus\Entity\Thesaurus\Expansion\Term:
    tbx_expansion_term1:
        expansion: '@tbx_expansion1'
        term: 'perceuse'
    tbx_expansion_term2:
        expansion: '@tbx_expansion1'
        term: 'tournevis'
