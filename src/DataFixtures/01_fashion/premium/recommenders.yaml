include:
    - ../localized_catalogs.yaml

# Product affinity from the Magento demo's relationships.php, as Gally recommenders.
#
# Gally does not derive recommendations from behaviour: nothing in the Recommender module reads
# tracking events. A recommender matches seed products with its sourceRule and offers the products
# its targetRule matches, resolved per request
# by ProductRecommendationProvider. So one recommender per source SKU per relation type, with the
# whole target list in a single `in` clause.
#
# `sku` is a reference source field with isUsedForRules set, which the rule engine requires, and
# reference fields accept `in`. The value of an `in` clause must be a
# JSON array: AbstractFilter::validateValueTypeByType rejects anything else.

Gally\Recommender\Entity\Recommender\Type:
    recommender_type_cross_sell:
        name: 'Cross-sell'
        code: 'cross-sell'
    recommender_type_upsell:
        name: 'Upsell'
        code: 'upsell'
    recommender_type_related:
        name: 'Related product'
        code: 'related_product'

