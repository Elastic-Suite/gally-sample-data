include:
    - zz_load_order.yaml

# The cms_page source fields, all seventeen of which default/ already declares.
#
# source_field is unique on (code, metadata_id), so none of them can be declared again under a
# different reference name: the second INSERT violates the
# constraint and the load dies. The reference names below are default/'s own, which makes Alice
# merge the two blocks into one object per field.
#
# One of those names is a typo default/ cannot fix: the `title` field's reference is
# `cms_page_tile`, because its own label block already points at it.
# Deriving the name from the code instead would declare a second field with code `title`. The
# values are copied verbatim, so which block wins is unobservable.
# Run bin/generate --verify-shared to check them against default/ after an upgrade.

Gally\Metadata\Entity\SourceField:
    cms_page_id:
        metadata: '@cms_page'
        code: id
        type: reference
        defaultSearchAnalyzer: reference
        isSortable: true
        isUsedForRules: true
    cms_page_tile:
        metadata: '@cms_page'
        code: title
        type: text
        isSystem: true
        weight: 10
        isSearchable: true
        isSpellchecked: true
        isUsedForRules: false
        isSortable: true
    cms_page_content_heading:
        metadata: '@cms_page'
        code: content_heading
        type: text
        isSearchable: true
        weight: 1
        isSpellchecked: true
        isFilterable: false
        isSortable: false
        isUsedForRules: false
    cms_page_content:
        metadata: '@cms_page'
        code: content
        type: text
        weight: 1
