include:
    - shared_cms_source_field.yaml

# Option codes that default/ already declares, reused verbatim.
#
# source_field_option is unique on (source_field, code). The reference names here are the ones
# default/ derives, so Alice merges rather than inserting twice.
# Only the per-locale labels in cms_source_field_option_label.yaml are ours, which is what lets a
# DIY catalog label a shared code its own way.

Gally\Metadata\Entity\SourceFieldOption:
    cms_page_content_type_option_blog:
        code: 'blog'
        source_field: '@cms_page_content_type'
        position: 0
        defaultLabel: 'Blog Post'
    cms_page_content_type_option_guide:
        code: 'guide'
        source_field: '@cms_page_content_type'
        position: 1
        defaultLabel: 'Buying Guide'
    cms_page_topic_option_materials:
        code: 'materials'
        source_field: '@cms_page_topic'
        position: 2
        defaultLabel: 'Materials'
    cms_page_topic_option_sustainability:
        code: 'sustainability'
        source_field: '@cms_page_topic'
        position: 4
        defaultLabel: 'Sustainability'
    cms_page_tags_option_materials:
        code: 'materials'
        source_field: '@cms_page_tags'
        position: 11
        defaultLabel: 'Materials'
    cms_page_tags_option_sustainability:
        code: 'sustainability'
        source_field: '@cms_page_tags'
        position: 28
        defaultLabel: 'Sustainability'
